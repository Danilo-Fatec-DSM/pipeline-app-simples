services:
  db:
    image: postgres:15-alpine
    container_name: danilo_db
    environment:
      POSTGRES_USER: fatec_user
      POSTGRES_PASSWORD: fatec_password
      POSTGRES_DB: todolist
    volumes:
      - danilo_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: danilo_api
    restart: always
    environment:
      DB_HOST: db
    depends_on:
      - db
    ports:
      - "3013:3000"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3013/tarefas"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s  

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
  web:
    build: ./frontend
    container_name: danilo_web
    ports:
      - "8013:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  danilo_data: