services:
  db:
    image: postgres:15-alpine
    container_name: danilo_db
    environment:
      POSTGRES_USER: fatec_user
      POSTGRES_PASSWORD: fatec_password
      POSTGRES_DB: todolist
    volumes:
      - danilo_data:/var/lib/postgresql/data

  api:
    build: ./backend
      - danilo_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: danilo_api
    restart: always
    environment:
      DB_HOST: db
    depends_on:
      - db
    ports:
      - "3013:3000"

  web:
    build: ./frontend
    container_name: danilo_web
    ports:
      - "8013:80"
    depends_on:
      - api

volumes:
  danilo_data: